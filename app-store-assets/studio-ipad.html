<!doctype html><html lang="en"><head><meta charset="utf-8"><title>CryptoCalk iPad screenshots</title>
<style>
  :root{--indigo:#6366f1;--indigo-d:#4f46e5;--violet:#8b5cf6;--deep:#1e1b4b;--ink:#0F172A;--gold:#FBBF24;--gold-d:#F59E0B;--mute:#64748B;--line:#E2E8F0;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
  html,body{width:2048px;height:2732px}
  body{font-family:-apple-system,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;color:#fff;overflow:hidden}
  .slide{position:relative;width:2048px;height:2732px;overflow:hidden;display:block}
  .bg{position:absolute;inset:0;z-index:0}
  .bg-a{background:radial-gradient(110% 80% at 50% -8%,#818cf8 0%,var(--indigo) 40%,var(--indigo-d) 74%,var(--deep) 100%)}
  .bg-b{background:radial-gradient(110% 75% at 82% 0%,#a78bfa 0%,var(--violet) 46%,#6d28d9 82%,var(--deep) 100%)}
  .bg-c{background:radial-gradient(110% 85% at 18% 0%,var(--indigo) 0%,#7c3aed 52%,#4c1d95 100%)}
  .grain{position:absolute;inset:0;z-index:1;opacity:.05;background-image:radial-gradient(#fff 1.6px,transparent 1.7px);background-size:40px 40px}
  .glow{position:absolute;z-index:1;border-radius:50%;filter:blur(110px)}
  .g1{width:900px;height:900px;left:-240px;top:-220px;background:#818cf8;opacity:.4}
  .g2{width:700px;height:700px;right:-200px;top:700px;background:var(--gold);opacity:.2}
  .brandmark{position:absolute;z-index:4;top:90px;right:140px;display:flex;align-items:center;gap:22px}
  .brandmark img{width:92px;height:92px;border-radius:22px;box-shadow:0 12px 34px rgba(0,0,0,.3)}
  .brandmark b{font-size:50px;font-weight:800}
  .cap{position:relative;z-index:3;padding:170px 160px 0;text-align:center}
  .eyebrow{display:inline-block;font-size:34px;font-weight:700;letter-spacing:.18em;color:#e0e7ff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:16px 36px;border-radius:999px;text-transform:uppercase}
  .headline{font-size:130px;line-height:1.02;font-weight:800;letter-spacing:-.03em;margin-top:40px}
  .headline .hl{color:var(--gold)}
  .sub{font-size:48px;line-height:1.3;font-weight:500;color:#e0e7ff;margin:34px auto 0;max-width:1500px}
  .stage{position:absolute;z-index:3;left:50%;transform:translateX(-50%);top:830px}
  .ipad{position:relative;width:1480px;height:1880px;border-radius:84px;background:#0b0b0d;padding:30px;box-shadow:0 70px 130px rgba(0,0,0,.45),0 0 0 3px rgba(255,255,255,.06) inset}
  .cam{position:absolute;top:48px;left:50%;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;background:#1a1a1f;z-index:10}
  .screen{position:relative;width:100%;height:100%;border-radius:58px;overflow:hidden;background:#F4F7FA;color:var(--ink);text-align:left}
  .sb{height:74px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 60px 12px;color:#fff;font-size:30px;font-weight:600}
  .ah{background:linear-gradient(180deg,var(--indigo),var(--indigo-d));color:#fff;padding:26px 60px 34px;display:flex;align-items:center;gap:26px}
  .ah img{width:74px;height:74px;border-radius:18px}.ah .t{font-size:48px;font-weight:800}.ah .s{font-size:30px;opacity:.85}
  .body{padding:56px 60px;height:calc(100% - 74px - 130px);overflow:hidden}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:48px;height:100%}
  .pill{display:inline-flex;align-items:center;gap:16px;background:#EEF2FF;color:#4338ca;font-weight:700;font-size:34px;padding:18px 36px;border-radius:999px}
  .h1{font-size:80px;font-weight:800;letter-spacing:-.02em;line-height:1.04;margin:30px 0 12px}.h1 .g{color:var(--indigo-d)}
  .muted{color:var(--mute);font-size:36px;line-height:1.35}
  .search{margin-top:40px;background:#fff;border:2px solid var(--line);border-radius:30px;padding:34px 40px;color:#94A3B8;font-size:36px}
  .lab{font-size:36px;font-weight:800;margin:0 0 24px}
  .card{background:#fff;border:1px solid var(--line);border-radius:32px;padding:36px;box-shadow:0 10px 26px rgba(15,23,42,.05);margin-bottom:28px}
  .row{display:flex;align-items:center;gap:28px}
  .ic{width:92px;height:92px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:46px;flex:none}
  .ic.indigo{background:#E0E7FF}.ic.gold{background:#FEF3C7}.ic.green{background:#DCFCE7}.ic.blue{background:#DBEAFE}.ic.violet{background:#EDE9FE}
  .ttl{font-size:40px;font-weight:800}.desc{font-size:30px;color:var(--mute);margin-top:6px}
  .badge{margin-left:auto;background:var(--gold);color:#3a2a00;font-weight:800;font-size:28px;padding:14px 26px;border-radius:999px}
  .field{display:flex;justify-content:space-between;align-items:center;background:#fff;border:2px solid var(--line);border-radius:28px;padding:34px 40px;margin-bottom:26px}
  .field .l{font-size:36px;color:var(--mute);font-weight:600}.field .v{font-size:46px;font-weight:800}
  .btn{background:var(--indigo);color:#fff;font-size:40px;font-weight:800;text-align:center;padding:38px;border-radius:30px;box-shadow:0 16px 34px rgba(99,102,241,.35)}
  .result{background:linear-gradient(180deg,#312e81,#4338ca);color:#fff;border-radius:38px;padding:54px}
  .result .k{font-size:36px;opacity:.85;font-weight:600}.result .big{font-size:120px;font-weight:800;letter-spacing:-.02em;line-height:1;margin-top:14px}.result .big small{font-size:48px;opacity:.8}
  .brk{display:flex;justify-content:space-between;font-size:38px;padding:28px 4px;border-top:1px solid #EEF2F6}.brk:first-child{border-top:0}.brk b{font-weight:800}
  .neg{color:#dc2626}.pos{color:#059669}
  .off{display:flex;gap:18px;align-items:center;background:#DCFCE7;color:#065F46;border-radius:26px;padding:30px 36px;font-size:38px;font-weight:700;margin-bottom:30px}
  .toast{display:flex;gap:18px;align-items:center;background:#EEF2FF;color:#4338ca;border-radius:26px;padding:30px 36px;font-size:34px;font-weight:700;margin-top:30px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:34px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:32px;padding:48px 18px;text-align:center;box-shadow:0 10px 24px rgba(15,23,42,.05)}
  .tile .e{font-size:80px}.tile .n{font-size:36px;font-weight:800;margin-top:18px}.tile .c{font-size:26px;color:var(--mute)}
  .store{position:absolute;z-index:5;left:50%;bottom:96px;transform:translateX(-50%);display:flex;align-items:center;gap:24px;background:#000;border:1px solid rgba(255,255,255,.25);padding:28px 56px;border-radius:28px}
  .store small{font-size:28px;opacity:.85;display:block;line-height:1}.store b{font-size:54px;font-weight:700}
</style></head><body><div id="root"></div>
<script>
const LOGO="logo.png";
const head=(t,s)=>`<div class="ah"><img src="${LOGO}"><div><div class="t">${t}</div>${s?`<div class="s">${s}</div>`:''}</div></div>`;
const SLIDES=[
 {bg:"bg-a",eyebrow:"128 calculators",headline:`Every crypto number, <span class="hl">sorted.</span>`,
  sub:"Trading, DeFi, mining, tax &amp; more — every crypto calculator in one app.",
  screen:`<div class="sb"><span>9:41</span><span>&#128246; &#128267;</span></div>${head("CryptoCalk","Crypto Calculators")}
   <div class="body"><div class="cols">
     <div><div class="pill">&#10024; 128 free crypto calculators</div><div class="h1">Free calculators for <span class="g">crypto</span></div>
       <div class="muted">Trading, DeFi, mining, tax and more.</div><div class="search">&#128269; Search calculators&#8230;</div></div>
     <div><div class="lab">Most popular</div>
       <div class="card row"><div class="ic green">&#128200;</div><div><div class="ttl">Profit / Loss</div><div class="desc">ROI across any coin</div></div></div>
       <div class="card row"><div class="ic indigo">&#128181;</div><div><div class="ttl">DCA Calculator</div><div class="desc">Average entry over time</div></div></div>
       <div class="card row"><div class="ic gold">&#9935;</div><div><div class="ttl">Mining</div><div class="desc">Rewards minus power cost</div></div></div></div>
   </div></div>`},
 {bg:"bg-c",eyebrow:"Profit & loss",headline:`Know your real <span class="hl">profit.</span>`,
  sub:"Entry, exit, fees and ROI — across every coin and position.",
  screen:`<div class="sb"><span>9:41</span><span>&#128246; &#128267;</span></div>${head("Profit / Loss","")}
   <div class="body"><div class="cols">
     <div><div class="field"><span class="l">Buy price</span><span class="v">$42,000</span></div>
       <div class="field"><span class="l">Sell price</span><span class="v">$61,500</span></div>
       <div class="field"><span class="l">Amount</span><span class="v">0.5 BTC</span></div>
       <div class="btn">Calculate</div></div>
     <div><div class="result"><div class="k">Total profit</div><div class="big">+$9,750<small> &#9650; 46.4%</small></div></div>
       <div class="card" style="margin-top:28px">
         <div class="brk"><span>Cost basis</span><b>$21,000</b></div>
         <div class="brk"><span>Exit value</span><b>$30,750</b></div>
         <div class="brk"><span>Trading fees</span><b class="neg">&#8211; $52</b></div>
         <div class="brk"><span>Net ROI</span><b class="pos">+46.4%</b></div></div></div>
   </div></div>`},
 {bg:"bg-b",eyebrow:"Always ready",headline:`Works 100% <span class="hl">offline.</span>`,
  sub:"Crunch numbers anywhere — formulas update automatically over the air.",
  screen:`<div class="sb"><span>9:41</span><span>&#9992;&#65039; &#128267;</span></div>${head("Liquidation Price","")}
   <div class="body"><div class="cols">
     <div><div class="off">&#10003; Works offline — no connection</div>
       <div class="field"><span class="l">Entry price</span><span class="v">$61,500</span></div>
       <div class="field"><span class="l">Leverage &middot; Side</span><span class="v">10&times; &middot; Long</span></div>
       <div class="toast">&#128260; Formulas auto-update over the air</div></div>
     <div><div class="result"><div class="k">Liquidation price</div><div class="big">$55,650<small> &#8211;9.5%</small></div></div>
       <div class="card" style="margin-top:28px">
         <div class="brk"><span>Position</span><b>Long 10&times;</b></div>
         <div class="brk"><span>Maintenance margin</span><b>0.5%</b></div>
         <div class="brk"><span>Distance to liq.</span><b class="pos">&#8211;9.5%</b></div></div></div>
   </div></div>`},
 {bg:"bg-a",eyebrow:"All in one",headline:`9 categories. <span class="hl">128</span> calculators.`,
  sub:"Trading &middot; Futures &middot; DeFi &middot; Mining &middot; Tax &middot; Portfolio &middot; Gas &amp; more.",
  screen:`<div class="sb"><span>9:41</span><span>&#128246; &#128267;</span></div>${head("Browse categories","")}
   <div class="body"><div class="grid">
     <div class="tile"><div class="e">&#128200;</div><div class="n">Trading</div><div class="c">Profit / Loss</div></div>
     <div class="tile"><div class="e">&#9889;</div><div class="n">Futures</div><div class="c">Liquidation</div></div>
     <div class="tile"><div class="e">&#127806;</div><div class="n">DeFi</div><div class="c">Staking &middot; APY</div></div>
     <div class="tile"><div class="e">&#9935;</div><div class="n">Mining</div><div class="c">Profitability</div></div>
     <div class="tile"><div class="e">&#129534;</div><div class="n">Tax</div><div class="c">Crypto tax</div></div>
     <div class="tile"><div class="e">&#128202;</div><div class="n">Portfolio</div><div class="c">Rebalancing</div></div>
     <div class="tile"><div class="e">&#128259;</div><div class="n">Convert</div><div class="c">Coin &#8596; fiat</div></div>
     <div class="tile"><div class="e">&#9981;</div><div class="n">Gas</div><div class="c">Network fees</div></div>
   </div></div>`},
];
const n=Math.max(1,Math.min(SLIDES.length,parseInt(new URLSearchParams(location.search).get('n')||'1',10)));
const s=SLIDES[n-1];
document.getElementById('root').innerHTML=`<div class="slide on">
  <div class="bg ${s.bg}"></div><div class="grain"></div><div class="glow g1"></div><div class="glow g2"></div>
  <div class="brandmark"><img src="${LOGO}"><b>CryptoCalk</b></div>
  <div class="cap"><span class="eyebrow">${s.eyebrow}</span><div class="headline">${s.headline}</div><div class="sub">${s.sub}</div></div>
  <div class="stage"><div class="ipad"><div class="cam"></div><div class="screen">${s.screen}</div></div></div>
  <div class="store"><div><small>Download on the</small><b>App Store</b></div></div>
</div>`;
</script></body></html>
