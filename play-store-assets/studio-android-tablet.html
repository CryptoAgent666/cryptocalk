<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>CryptoCalk Google Play tablet screenshots</title>
<style>
  :root{--indigo:#6366f1;--indigo-d:#4f46e5;--violet:#8b5cf6;--deep:#1e1b4b;--ink:#0F172A;--gold:#FBBF24;--mute:#64748B;--line:#E2E8F0;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
  /* Google Play tablet screenshot: 2560×1440 = 16:9 landscape (Play-compliant) */
  html,body{width:2560px;height:1440px}
  body{font-family:-apple-system,"SF Pro Display","Roboto","Helvetica Neue",Arial,sans-serif;color:#fff;overflow:hidden}
  .slide{position:relative;width:2560px;height:1440px;overflow:hidden}
  .bg{position:absolute;inset:0;z-index:0}
  .bg-a{background:radial-gradient(90% 120% at 12% 10%,#818cf8 0%,var(--indigo) 38%,var(--indigo-d) 70%,var(--deep) 100%)}
  .bg-b{background:radial-gradient(95% 120% at 8% 0%,#a78bfa 0%,var(--violet) 44%,#6d28d9 80%,var(--deep) 100%)}
  .bg-c{background:radial-gradient(95% 120% at 10% 100%,var(--indigo) 0%,#7c3aed 50%,#4c1d95 100%)}
  .grain{position:absolute;inset:0;z-index:1;opacity:.05;background-image:radial-gradient(#fff 1.5px,transparent 1.6px);background-size:36px 36px}
  .glow{position:absolute;z-index:1;border-radius:50%;filter:blur(110px)}
  .g1{width:760px;height:760px;left:-200px;top:-200px;background:#818cf8;opacity:.45}
  .g2{width:620px;height:620px;right:-160px;bottom:-220px;background:var(--gold);opacity:.18}

  .left{position:absolute;z-index:3;left:140px;top:0;height:100%;width:1000px;display:flex;flex-direction:column;justify-content:center}
  .brand{display:flex;align-items:center;gap:20px;margin-bottom:40px}
  .brand img{width:84px;height:84px;border-radius:20px;box-shadow:0 12px 34px rgba(0,0,0,.3)}
  .brand b{font-size:48px;font-weight:800;letter-spacing:-.01em}
  .eyebrow{display:inline-block;align-self:flex-start;font-size:30px;font-weight:700;letter-spacing:.16em;color:#e0e7ff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:14px 30px;border-radius:999px;text-transform:uppercase}
  .headline{font-size:104px;line-height:1.03;font-weight:800;letter-spacing:-.03em;margin-top:34px}
  .headline .hl{color:var(--gold)}
  .sub{font-size:42px;line-height:1.32;font-weight:500;color:#e0e7ff;margin-top:30px;max-width:900px}
  .store{margin-top:54px;display:inline-flex;align-self:flex-start;align-items:center;gap:20px;background:#000;border:1px solid rgba(255,255,255,.25);padding:22px 44px;border-radius:22px}
  .store .ai{font-size:52px;line-height:1}
  .store small{font-size:22px;opacity:.85;display:block;line-height:1}
  .store b{font-size:42px;font-weight:700}

  /* landscape tablet device */
  .stage{position:absolute;z-index:3;right:120px;top:50%;transform:translateY(-50%)}
  .tablet{position:relative;width:1320px;height:1000px;border-radius:56px;background:#0b0b0d;padding:26px;box-shadow:0 60px 130px rgba(0,0,0,.5),0 0 0 3px rgba(255,255,255,.06) inset}
  .cam{position:absolute;left:30px;top:50%;transform:translateY(-50%);width:16px;height:16px;border-radius:50%;background:#1a1a1f;z-index:10}
  .screen{position:relative;width:100%;height:100%;border-radius:34px;overflow:hidden;background:#F4F7FA;color:var(--ink);text-align:left}

  .ah{background:linear-gradient(180deg,var(--indigo),var(--indigo-d));color:#fff;padding:24px 48px 28px;display:flex;align-items:center;gap:22px}
  .ah img{width:60px;height:60px;border-radius:15px}.ah .t{font-size:40px;font-weight:800}.ah .s{font-size:26px;opacity:.85}
  .body{padding:40px 48px;height:calc(100% - 112px);overflow:hidden}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:44px;height:100%}
  .pill{display:inline-flex;align-items:center;gap:14px;background:#EEF2FF;color:#4338ca;font-weight:700;font-size:30px;padding:16px 30px;border-radius:999px}
  .h1{font-size:66px;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:26px 0 10px}.h1 .g{color:var(--indigo-d)}
  .muted{color:var(--mute);font-size:30px;line-height:1.35}
  .search{margin-top:34px;background:#fff;border:2px solid var(--line);border-radius:26px;padding:28px 34px;color:#94A3B8;font-size:30px}
  .lab{font-size:30px;font-weight:800;margin:0 0 20px}
  .card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:30px;box-shadow:0 8px 22px rgba(15,23,42,.05);margin-bottom:22px}
  .row{display:flex;align-items:center;gap:24px}
  .ic{width:78px;height:78px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:40px;flex:none}
  .ic.indigo{background:#E0E7FF}.ic.gold{background:#FEF3C7}.ic.green{background:#DCFCE7}.ic.blue{background:#DBEAFE}.ic.violet{background:#EDE9FE}
  .ttl{font-size:34px;font-weight:800}.desc{font-size:26px;color:var(--mute);margin-top:4px}
  .field{display:flex;justify-content:space-between;align-items:center;background:#fff;border:2px solid var(--line);border-radius:24px;padding:28px 34px;margin-bottom:22px}
  .field .l{font-size:30px;color:var(--mute);font-weight:600}.field .v{font-size:38px;font-weight:800}
  .btn{background:var(--indigo);color:#fff;font-size:34px;font-weight:800;text-align:center;padding:32px;border-radius:26px;box-shadow:0 14px 30px rgba(99,102,241,.35)}
  .result{background:linear-gradient(180deg,#312e81,#4338ca);color:#fff;border-radius:32px;padding:44px}
  .result .k{font-size:30px;opacity:.85;font-weight:600}.result .big{font-size:104px;font-weight:800;letter-spacing:-.02em;line-height:1;margin-top:12px}.result .big small{font-size:40px;opacity:.8}
  .brk{display:flex;justify-content:space-between;font-size:32px;padding:24px 4px;border-top:1px solid #EEF2F6}.brk:first-child{border-top:0}.brk b{font-weight:800}
  .neg{color:#dc2626}.pos{color:#059669}
  .off{display:flex;gap:16px;align-items:center;background:#DCFCE7;color:#065F46;border-radius:24px;padding:26px 32px;font-size:32px;font-weight:700;margin-bottom:26px}
  .toast{display:flex;gap:16px;align-items:center;background:#EEF2FF;color:#4338ca;border-radius:24px;padding:26px 32px;font-size:30px;font-weight:700;margin-top:26px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:28px;padding:38px 16px;text-align:center;box-shadow:0 8px 20px rgba(15,23,42,.05)}
  .tile .e{font-size:66px}.tile .n{font-size:32px;font-weight:800;margin-top:14px}.tile .c{font-size:24px;color:var(--mute)}
</style></head><body><div id="root"></div>
<script>
const LOGO="logo.png";
const head=(t,s)=>`<div class="ah"><img src="${LOGO}"><div><div class="t">${t}</div>${s?`<div class="s">${s}</div>`:''}</div></div>`;
const SLIDES=[
 {bg:"bg-a",eyebrow:"128 calculators",headline:`Every crypto number, <span class="hl">sorted.</span>`,
  sub:"Trading, DeFi, mining, tax &amp; more — every crypto calculator in one app.",
  screen:`${head("CryptoCalk","Crypto Calculators")}
   <div class="body"><div class="cols">
     <div><div class="pill">&#10024; 128 free crypto calculators</div><div class="h1">Free calculators for <span class="g">crypto</span></div>
       <div class="muted">Trading, DeFi, mining, tax and more.</div><div class="search">&#128269; Search calculators&#8230;</div></div>
     <div><div class="lab">Most popular</div>
       <div class="card row"><div class="ic green">&#128200;</div><div><div class="ttl">Profit / Loss</div><div class="desc">ROI across any coin</div></div></div>
       <div class="card row"><div class="ic indigo">&#128181;</div><div><div class="ttl">DCA Calculator</div><div class="desc">Average entry over time</div></div></div>
       <div class="card row"><div class="ic gold">&#9935;</div><div><div class="ttl">Mining</div><div class="desc">Rewards minus power cost</div></div></div></div>
   </div></div>`},
 {bg:"bg-c",eyebrow:"Profit & loss",headline:`Know your real <span class="hl">profit.</span>`,
  sub:"Entry, exit, fees and ROI — across every coin and position.",
  screen:`${head("Profit / Loss","")}
   <div class="body"><div class="cols">
     <div><div class="field"><span class="l">Buy price</span><span class="v">$42,000</span></div>
       <div class="field"><span class="l">Sell price</span><span class="v">$61,500</span></div>
       <div class="field"><span class="l">Amount</span><span class="v">0.5 BTC</span></div>
       <div class="btn">Calculate</div></div>
     <div><div class="result"><div class="k">Total profit</div><div class="big">+$9,750<small> &#9650; 46.4%</small></div></div>
       <div class="card" style="margin-top:26px">
         <div class="brk"><span>Cost basis</span><b>$21,000</b></div>
         <div class="brk"><span>Exit value</span><b>$30,750</b></div>
         <div class="brk"><span>Trading fees</span><b class="neg">&#8211; $52</b></div>
         <div class="brk"><span>Net ROI</span><b class="pos">+46.4%</b></div></div></div>
   </div></div>`},
 {bg:"bg-b",eyebrow:"Always ready",headline:`Works 100% <span class="hl">offline.</span>`,
  sub:"Crunch numbers anywhere — formulas update automatically over the air.",
  screen:`${head("Liquidation Price","")}
   <div class="body"><div class="cols">
     <div><div class="off">&#10003; Works offline — no connection</div>
       <div class="field"><span class="l">Entry price</span><span class="v">$61,500</span></div>
       <div class="field"><span class="l">Leverage &middot; Side</span><span class="v">10&times; &middot; Long</span></div>
       <div class="toast">&#128260; Formulas auto-update over the air</div></div>
     <div><div class="result"><div class="k">Liquidation price</div><div class="big">$55,650<small> &#8211;9.5%</small></div></div>
       <div class="card" style="margin-top:26px">
         <div class="brk"><span>Position</span><b>Long 10&times;</b></div>
         <div class="brk"><span>Maintenance margin</span><b>0.5%</b></div>
         <div class="brk"><span>Distance to liq.</span><b class="pos">&#8211;9.5%</b></div></div></div>
   </div></div>`},
 {bg:"bg-a",eyebrow:"All in one",headline:`9 categories. <span class="hl">128</span> calculators.`,
  sub:"Trading &middot; Futures &middot; DeFi &middot; Mining &middot; Tax &middot; Portfolio &middot; Gas &amp; more.",
  screen:`${head("Browse categories","")}
   <div class="body"><div class="grid">
     <div class="tile"><div class="e">&#128200;</div><div class="n">Trading</div><div class="c">Profit / Loss</div></div>
     <div class="tile"><div class="e">&#9889;</div><div class="n">Futures</div><div class="c">Liquidation</div></div>
     <div class="tile"><div class="e">&#127806;</div><div class="n">DeFi</div><div class="c">Staking &middot; APY</div></div>
     <div class="tile"><div class="e">&#9935;</div><div class="n">Mining</div><div class="c">Profitability</div></div>
     <div class="tile"><div class="e">&#129534;</div><div class="n">Tax</div><div class="c">Crypto tax</div></div>
     <div class="tile"><div class="e">&#128202;</div><div class="n">Portfolio</div><div class="c">Rebalancing</div></div>
     <div class="tile"><div class="e">&#128259;</div><div class="n">Convert</div><div class="c">Coin &#8596; fiat</div></div>
     <div class="tile"><div class="e">&#9981;</div><div class="n">Gas</div><div class="c">Network fees</div></div>
     <div class="tile"><div class="e">&#129689;</div><div class="n">Airdrops</div><div class="c">Airdrop value</div></div>
   </div></div>`},
];
const n=Math.max(1,Math.min(SLIDES.length,parseInt(new URLSearchParams(location.search).get('n')||'1',10)));
const s=SLIDES[n-1];
document.getElementById('root').innerHTML=`<div class="slide">
  <div class="bg ${s.bg}"></div><div class="grain"></div><div class="glow g1"></div><div class="glow g2"></div>
  <div class="left">
    <div class="brand"><img src="${LOGO}"><b>CryptoCalk</b></div>
    <span class="eyebrow">${s.eyebrow}</span>
    <div class="headline">${s.headline}</div>
    <div class="sub">${s.sub}</div>
    <div class="store"><span class="ai">&#9654;</span><div><small>GET IT ON</small><b>Google Play</b></div></div>
  </div>
  <div class="stage"><div class="tablet"><div class="cam"></div><div class="screen">${s.screen}</div></div></div>
</div>`;
</script></body></html>
